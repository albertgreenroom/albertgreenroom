<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neko Eyes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas { position: fixed; top: 0; left: 0; display: block; }
    video  { display: none; position: fixed; }
    #info  {
      position: fixed;
      bottom: 28px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.30);
      font: 13px/1.5 system-ui, sans-serif;
      pointer-events: none;
      transition: opacity 3s ease;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <video  id="video" playsinline autoplay muted></video>
  <div   id="info">Iniciando cámara...</div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.js"></script>

  <script>
  (() => {
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const video  = document.getElementById('video');
    const info   = document.getElementById('info');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const gaze       = { x: 0, y: 0 };
    const targetGaze = { x: 0, y: 0 };

    let blinkValue = 0;
    let blinkPhase = 'wait';

    function scheduleBlink() {
      setTimeout(() => { blinkPhase = 'closing'; }, 2000 + Math.random() * 4000);
    }
    scheduleBlink();

    let model = null;
    let busy  = false;

    async function detectFace() {
      if (!model || busy || video.readyState < 2) return;
      busy = true;
      try {
        const faces = await model.estimateFaces(video, false);
        if (faces.length > 0) {
          const f  = faces[0];
          const vw = video.videoWidth  || 640;
          const vh = video.videoHeight || 480;
          let fx, fy;
          if (f.landmarks && f.landmarks.length > 2) {
            fx = f.landmarks[2][0] / vw;
            fy = f.landmarks[2][1] / vh;
          } else {
            fx = (f.topLeft[0] + f.bottomRight[0]) / 2 / vw;
            fy = (f.topLeft[1] + f.bottomRight[1]) / 2 / vh;
          }
          targetGaze.x = Math.max(-1, Math.min(1, -(fx - 0.5) * 2.5));
          targetGaze.y = Math.max(-1, Math.min(1,  (fy - 0.5) * 1.8));
        }
      } catch (_) {}
      busy = false;
    }

    async function init() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
        video.srcObject = stream;
        await new Promise(r => { video.onloadedmetadata = r; });
        await video.play();

        info.textContent = 'Cargando modelo IA...';
        model = await blazeface.load();
        setInterval(detectFace, 80);

        info.textContent = '';
        setTimeout(() => { info.style.opacity = '0'; }, 600);

      } catch (_) {
        info.textContent = 'Sin cámara — mueve el dedo';
        const setGaze = (x, y) => {
          targetGaze.x = ((x / window.innerWidth)  - 0.5) * 2;
          targetGaze.y = ((y / window.innerHeight) - 0.5) * 1.6;
        };
        window.addEventListener('mousemove', e => setGaze(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => {
          e.preventDefault();
          setGaze(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
      }
    }

    // Forma de ojo neko: esquina exterior elevada, interior suave
    function eyeShapePath(rx, ry, flip) {
      const f = flip ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(-rx, ry * 0.08);
      // Párpado superior: arco pronunciado con upturn en esquina exterior
      ctx.bezierCurveTo(
        -rx * 0.45, -ry * 1.15,
         rx * 0.55, -ry * 1.18,
         rx,        -ry * 0.10
      );
      // Párpado inferior: suave y redondeado
      ctx.bezierCurveTo(
         rx * 0.55, ry * 0.88,
        -rx * 0.45, ry * 0.88,
        -rx, ry * 0.08
      );
    }

    // Destello en estrella de 4 puntas (kawaii)
    function drawSparkle(cx, cy, size) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = 'rgba(255,255,255,0.96)';
      ctx.beginPath();
      ctx.ellipse(0, 0, size, size * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 0.22, size, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawEye(cx, cy, w, h, gx, gy, blink, flip) {
      const rx = w / 2;
      const ry = h / 2;

      ctx.save();
      ctx.translate(cx, cy);

      // Clip a la forma del ojo
      ctx.save();
      eyeShapePath(rx, ry, flip);
      ctx.clip();

      // Blanco del ojo (sclera cálida)
      ctx.fillStyle = '#fff8f0';
      ctx.fillRect(-rx - 1, -ry - 1, w + 2, h + 2);

      // Iris dorado/ámbar — color de gatito
      const irisR  = ry * 0.90;
      const maxOff = Math.max(0, rx - irisR) * 0.85;
      const ipx    = Math.max(-maxOff, Math.min( maxOff, gx * maxOff));
      const ipy    = Math.max(-maxOff * 0.5, Math.min(maxOff * 0.5, gy * maxOff * 0.5));

      // Gradiente iris: centro luminoso ámbar → verde exterior (ojos de gato)
      const ig = ctx.createRadialGradient(
        ipx - irisR * 0.15, ipy - irisR * 0.20, irisR * 0.03,
        ipx, ipy, irisR
      );
      ig.addColorStop(0,    '#fff4c0');
      ig.addColorStop(0.18, '#fdd835');
      ig.addColorStop(0.42, '#f5a623');
      ig.addColorStop(0.65, '#c8780a');
      ig.addColorStop(0.82, '#7a5200');
      ig.addColorStop(1,    '#2e1800');
      ctx.beginPath();
      ctx.arc(ipx, ipy, irisR, 0, Math.PI * 2);
      ctx.fillStyle = ig;
      ctx.fill();

      // Anillo de fibras del iris (textura sutil)
      ctx.save();
      ctx.globalAlpha = 0.13;
      ctx.strokeStyle = '#3d2000';
      ctx.lineWidth   = 0.7;
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 10) {
        ctx.beginPath();
        ctx.moveTo(ipx, ipy);
        ctx.lineTo(ipx + Math.cos(a) * irisR, ipy + Math.sin(a) * irisR);
        ctx.stroke();
      }
      ctx.restore();

      // Aro limbal (borde oscuro del iris)
      ctx.beginPath();
      ctx.arc(ipx, ipy, irisR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(20,8,0,0.55)';
      ctx.lineWidth   = irisR * 0.08;
      ctx.stroke();

      // Pupila vertical de gato (ranura oval)
      const pR  = irisR * 0.42;
      const pW  = pR * 0.34;   // estrecha
      const pH  = pR * 1.05;   // alta
      ctx.save();
      ctx.translate(ipx, ipy);
      // Forma de la pupila — elipse vertical con punta suave en extremos
      ctx.beginPath();
      ctx.ellipse(0, 0, pW, pH, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#080008';
      ctx.fill();
      // Brillo interior de pupila
      const pupilGrad = ctx.createRadialGradient(-pW * 0.4, -pH * 0.35, 0, 0, 0, pH);
      pupilGrad.addColorStop(0, 'rgba(80,20,100,0.35)');
      pupilGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = pupilGrad;
      ctx.fill();
      ctx.restore();

      // Destellos kawaii ✦
      // Grande en estrella (arriba-izquierda del iris)
      drawSparkle(ipx - irisR * 0.30, ipy - irisR * 0.32, irisR * 0.26);

      // Oval secundario (abajo-derecha)
      ctx.save();
      ctx.translate(ipx + irisR * 0.28, ipy + irisR * 0.20);
      ctx.rotate(0.3);
      ctx.beginPath();
      ctx.ellipse(0, 0, irisR * 0.10, irisR * 0.15, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.80)';
      ctx.fill();
      ctx.restore();

      // Pequeño punto extra (muy kawaii)
      ctx.beginPath();
      ctx.arc(ipx + irisR * 0.08, ipy - irisR * 0.50, irisR * 0.06, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.70)';
      ctx.fill();

      // Párpado de parpadeo (se desliza desde arriba)
      if (blink > 0.005) {
        const closeY = -ry + blink * (h + ry * 0.20);
        ctx.beginPath();
        ctx.moveTo(-rx * 1.2, -ry * 1.5);
        ctx.lineTo( rx * 1.2, -ry * 1.5);
        ctx.lineTo( rx * 1.2,  closeY);
        ctx.bezierCurveTo(
           rx * 0.5, closeY + ry * 0.28,
          -rx * 0.5, closeY + ry * 0.28,
          -rx * 1.2, closeY
        );
        ctx.closePath();
        ctx.fillStyle = '#0a0110';
        ctx.fill();
      }

      ctx.restore(); // fin clip

      // ── Fuera del clip: líneas y pestañas ───────────────────────

      // Línea superior del párpado — trazo grueso estilo manga
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-rx * 1.02, ry * 0.09);
      ctx.bezierCurveTo(-rx * 0.50, -ry * 1.30, rx * 0.58, -ry * 1.35, rx * 1.02, -ry * 0.08);
      ctx.strokeStyle = '#0a0010';
      ctx.lineWidth   = h * 0.125;
      ctx.lineCap     = 'round';
      ctx.stroke();
      ctx.restore();

      // Pestañas superiores — delicadas y curvadas
      const lashDefs = [
        [0.08, 0.90], [0.22, 1.05], [0.38, 1.18],
        [0.52, 1.22], [0.66, 1.15], [0.80, 1.02], [0.93, 0.88],
      ];
      for (const [t, ls] of lashDefs) {
        const θ  = Math.PI + t * Math.PI;
        const bx = rx * Math.cos(θ) * 1.05;
        const by = ry * Math.sin(θ) * 1.05 - ry * 0.10;
        const dir = Math.atan2(by + ry * 0.12, bx) - Math.PI * 0.18;
        const len = h * 0.28 * ls;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(
          bx + Math.cos(dir - 0.15) * len * 0.45,
          by + Math.sin(dir - 0.15) * len * 0.45,
          bx + Math.cos(dir) * len,
          by + Math.sin(dir) * len
        );
        ctx.strokeStyle = '#0a0010';
        ctx.lineWidth   = h * 0.040;
        ctx.lineCap     = 'round';
        ctx.stroke();
        ctx.restore();
      }

      // Párpado inferior — línea fina
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-rx * 0.92, ry * 0.14);
      ctx.bezierCurveTo(-rx * 0.38, ry * 1.05, rx * 0.38, ry * 1.05, rx * 0.92, ry * 0.14);
      ctx.strokeStyle = '#160020';
      ctx.lineWidth   = h * 0.035;
      ctx.lineCap     = 'round';
      ctx.stroke();
      ctx.restore();

      ctx.restore(); // fin translate
    }

    // Cejas redondeadas de gatito
    function drawBrow(cx, cy, w, h) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.beginPath();
      ctx.moveTo(-w * 0.42, h * 0.08);
      ctx.bezierCurveTo(-w * 0.10, -h * 0.40, w * 0.18, -h * 0.38, w * 0.42, h * 0.06);
      ctx.strokeStyle = '#2a0e18';
      ctx.lineWidth   = h * 0.16;
      ctx.lineCap     = 'round';
      ctx.stroke();
      ctx.restore();
    }

    // Bigotes de gatito
    function drawWhiskers(cx, cy, eyeW, eyeH, side) {
      const angles = [-0.12, 0.02, 0.16];
      const lens   = [0.90, 1.00, 0.85];
      for (let i = 0; i < 3; i++) {
        const angle = side * angles[i];
        const len   = eyeW * 0.95 * lens[i];
        const wx    = cx;
        const wy    = cy + eyeH * (i * 0.22 - 0.15);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(wx, wy);
        ctx.lineTo(wx + side * Math.cos(angle) * len, wy + Math.sin(angle) * len);
        ctx.strokeStyle = 'rgba(255, 200, 220, 0.50)';
        ctx.lineWidth   = 1.6;
        ctx.lineCap     = 'round';
        ctx.stroke();
        ctx.restore();
      }
    }

    // Nariz triangular de gatito
    function drawNose(cx, cy, size) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.beginPath();
      ctx.moveTo(0, size * 0.75);
      ctx.lineTo(-size, 0);
      ctx.lineTo( size, 0);
      ctx.closePath();
      const ng = ctx.createLinearGradient(0, 0, 0, size * 0.75);
      ng.addColorStop(0, '#ff8fb0');
      ng.addColorStop(1, '#e0607a');
      ctx.fillStyle = ng;
      ctx.fill();
      // Brillo en nariz
      ctx.beginPath();
      ctx.ellipse(-size * 0.25, size * 0.18, size * 0.20, size * 0.12, -0.3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fill();
      ctx.restore();
    }

    // Frame principal
    function draw() {
      const W = canvas.width;
      const H = canvas.height;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      const eyeH    = Math.min(W * 0.25, H * 0.30);
      const eyeW    = eyeH * 1.68;
      const spacing = eyeW * 1.14;
      const eyeY    = H * 0.47;

      // Resplandor ámbar detrás de cada ojo
      for (const s of [-1, 1]) {
        const ex = W / 2 + s * spacing / 2;
        const gw = ctx.createRadialGradient(ex, eyeY, 0, ex, eyeY, eyeW * 0.90);
        gw.addColorStop(0, 'rgba(200, 140, 0, 0.12)');
        gw.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gw;
        ctx.beginPath();
        ctx.ellipse(ex, eyeY, eyeW * 0.90, eyeH * 1.15, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Mejillas rosadas (más pronunciadas, kawaii)
      for (const s of [-1, 1]) {
        const bx = W / 2 + s * spacing / 2;
        const by = eyeY + eyeH * 0.88;
        const bg = ctx.createRadialGradient(bx, by, 0, bx, by, eyeW * 0.48);
        bg.addColorStop(0, 'rgba(255, 90, 120, 0.28)');
        bg.addColorStop(1, 'rgba(255, 90, 120, 0)');
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.ellipse(bx, by, eyeW * 0.48, eyeH * 0.60, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Cejas
      drawBrow(W / 2 - spacing / 2, eyeY - eyeH * 0.96, eyeW, eyeH);
      drawBrow(W / 2 + spacing / 2, eyeY - eyeH * 0.96, eyeW, eyeH);

      // Bigotes (arrancan del centro, hacia fuera)
      const whiskY = eyeY + eyeH * 0.62;
      drawWhiskers(W / 2, whiskY, eyeW, eyeH, -1);
      drawWhiskers(W / 2, whiskY, eyeW, eyeH,  1);

      // Nariz
      drawNose(W / 2, eyeY + eyeH * 0.40, eyeH * 0.16);

      // Ojos neko
      drawEye(W / 2 - spacing / 2, eyeY, eyeW, eyeH, gaze.x, gaze.y, blinkValue, false);
      drawEye(W / 2 + spacing / 2, eyeY, eyeW, eyeH, gaze.x, gaze.y, blinkValue, true);
    }

    function loop() {
      gaze.x += (targetGaze.x - gaze.x) * 0.10;
      gaze.y += (targetGaze.y - gaze.y) * 0.10;

      if (blinkPhase === 'closing') {
        blinkValue += 0.16;
        if (blinkValue >= 1) { blinkValue = 1; blinkPhase = 'opening'; }
      } else if (blinkPhase === 'opening') {
        blinkValue -= 0.10;
        if (blinkValue <= 0) { blinkValue = 0; blinkPhase = 'wait'; scheduleBlink(); }
      }

      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
    init();
  })();
  </script>
</body>
</html>
